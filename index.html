<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certify'em Certificate Viewer</title>
    
    <!-- ESTE ES EL TRUCO PARA CAMBIAR LA URL VISUALMENTE -->
    <script>
        // Cambia la URL que se muestra en el navegador sin recargar la página
        window.history.replaceState(null, null, "https://c.certifyem.com/");
    </script>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RY2X4ST114"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-RY2X4ST114');
    </script>

    <style>
        /* --- ESTILOS GENERALES --- */
        body {
            font-family: Arial, Times, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #000;
        }

        /* --- ENCABEZADO --- */
        .header-container {
            height: 125px;
            width: 100%;
            padding: 5px;
            margin-bottom: 4px;
            box-sizing: border-box;
            box-shadow: 0px 4px #226e93; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            height: 90px;
            margin-left: 10px;
        }

        .info-table {
            font-size: 16px;
            margin-right: 30px;
            border-collapse: collapse;
        }

        .info-table td {
            padding: 2px 0;
        }

        .info-table td:first-child {
            text-align: right;
            font-weight: bold;
        }

        .info-table td:nth-child(2) {
            width: 15px;
        }

        /* --- TEXTO DE INSTRUCCIÓN --- */
        .instruction-bar {
            height: 40px;
            line-height: 40px;
            text-align: center;
            font-size: 14px;
            padding: 0 15px;
        }

        /* --- CONTENEDOR DEL CERTIFICADO (IFRAME) --- */
        .certificate-wrapper {
            width: 100%;
            height: 650px;
            background-color: #222; 
            display: flex;
            justify-content: center;
        }

        .certificate-iframe {
            border: none;
            width: 100%;
            height: 100%;
            max-width: 1200px; 
            background-color: #fff;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        /* --- RESPONSIVIDAD --- */
        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                height: auto;
                padding-bottom: 15px;
            }
            .logo {
                margin: 10px 0;
            }
            .info-table {
                margin-right: 0;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- ENCABEZADO -->
    <div class="header-container">
        <img class="logo" src="https://scooper.gleeda.net/certifyem/certifyem_logo.png" alt="Certify'em Logo">
        
        <table class="info-table">
            <tr>
                <td>Certificate Id:</td>
                <td></td>
                <td>F2SNNO-CE004857</td>
            </tr>
            <tr>
                <td>Issued To:</td>
                <td></td>
                <td>JOSE ALEJANDRO LOPEZ GARCIA</td>
            </tr>
            <tr>
                <td>Issued By:</td>
                <td></td>
                <td>soylidernet@gmail.com</td>
            </tr>
            <tr>
                <td>Issue Date:</td>
                <td></td>
                <td>OCTOBER 2026</td>
            </tr>
        </table>
    </div>

    <!-- TEXTO DE INSTRUCCIÓN -->
    <div class="instruction-bar">
        Confirm that all details of the certificate shown below match the certificate you scanned, and also match the details listed above.
    </div>

    <!-- VISOR DEL CERTIFICADO -->
    <div class="certificate-wrapper">
        <iframe class="certificate-iframe" src="https://drive.google.com/file/d/132ZJ9mFUv1XAPl_ZA1N9YHris-HuOzig/preview" allow="autoplay"></iframe>
    </div>

</body>
</html>
